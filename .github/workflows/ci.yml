name: CI

on:
  push:
    branches: [main, change-tracking-and-agent-pages]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-sqlite:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  backend-postgres:
    name: Backend tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fullhouse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fullhouse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # The Postgres migration test only runs here, where a server exists.
      - run: python -m pytest -q

  audit:
    name: Known vulnerabilities in dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev
        working-directory: frontend

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-sqlite, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env:
          E2E_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: [backend-sqlite, frontend]
    env:
      # The bundled model is ~5 GB. The scripted provider drives the same
      # run pipeline -- tools, persistence, streaming -- without downloading it.
      LLM_PROVIDER: scripted
      WEB_PORT: "8080"
      # The smoke test signs in with a password; two-step sign-in has its own tests.
      REQUIRE_MFA: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build backend frontend
      - name: Start backend and frontend
        run: docker compose up -d backend frontend
      - name: Wait for the app through nginx
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health >/dev/null; then echo "healthy after ${i}s"; exit 0; fi
            sleep 1
          done
          docker compose logs backend frontend
          exit 1
      - name: Smoke-test the API and a live run through nginx
        run: |
          set -euo pipefail
          base=http://localhost:8080
          curl -fsS $base/ | grep -q '<div id="root">'
          # Everything past the login page needs an account: the first sign-up is the owner.
          curl -fsS -c jar -b jar -X POST $base/api/v1/auth/signup -H 'Content-Type: application/json' \
            -d '{"name":"CI","email":"ci@example.com","password":"a-long-password"}' >/dev/null
          agents=$(curl -fsS -b jar $base/api/v1/agents/definitions | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))')
          test "$agents" -eq 1
          run=$(curl -fsS -b jar -X POST $base/api/v1/agents/runs \
            -H 'Content-Type: application/json' \
            -d '{"agent_key":"maestro","input":"CI smoke test: check stock"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
          # The stream must arrive through nginx unbuffered and end on its own.
          timeout 60 curl -fsSN -b jar "$base/api/v1/agents/runs/$run/stream" | tee stream.txt | grep -q '__end__'
          grep -q '"tool_call"' stream.txt
          echo "run $run streamed $(grep -c '^data:' stream.txt) events through nginx"
      - name: Container logs
        if: always()
        run: docker compose logs --no-color backend frontend | tail -200
      - name: Stop
        if: always()
        run: docker compose down -v

  demo-image:
    name: Demo image build and smoke test
    runs-on: ubuntu-latest
    needs: [backend-sqlite, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build the single-container image
        run: docker build -t fullhouse-demo .
      - name: Start it the way Render does, on an assigned port
        run: docker run -d --name demo -e PORT=10000 -p 10000:10000 fullhouse-demo
      - name: Wait for it
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:10000/health >/dev/null; then echo "healthy after ${i}s"; exit 0; fi
            sleep 1
          done
          docker logs demo
          exit 1
      - name: Smoke-test the demo
        run: |
          set -euo pipefail
          base=http://localhost:10000
          curl -fsS $base/ | grep -q '<div id="root">'
          # The login page offers the demo's shared account; sign in with it.
          creds=$(curl -fsS $base/api/v1/auth/options | python3 -c 'import sys,json; print(json.dumps(json.load(sys.stdin)["demo"]))')
          curl -fsS -c jar -b jar -X POST $base/api/v1/auth/login -H 'Content-Type: application/json' -d "$creds" >/dev/null
          curl -fsS -b jar $base/api/v1/agents/runtime | python3 -c 'import sys,json; r=json.load(sys.stdin); assert r["demo_mode"] and r["provider"] == "scripted", r'
          pending=$(curl -fsS -b jar "$base/api/v1/agents/actions?status=pending" | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))')
          test "$pending" -ge 1
          # The main event: this week's digest has dollars at stake and cards in all three sections.
          curl -fsS -b jar $base/api/v1/prices/digest | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["total"] > 0 and all(s["cards"] for s in d["sections"]), d'
          questions=$(curl -fsS -b jar $base/api/v1/prices/questions | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))')
          test "$questions" -ge 1
          run=$(curl -fsS -b jar -X POST $base/api/v1/agents/runs -H 'Content-Type: application/json' \
            -d '{"agent_key":"maestro","input":"Check stock and the staff schedule"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
          timeout 60 curl -fsSN -b jar "$base/api/v1/agents/runs/$run/stream" | tee stream.txt | grep -q '__end__'
          grep -q '"tool_call"' stream.txt
          grep -q '"succeeded"' stream.txt
          echo "The Assistant Manager ran its tools and finished, with $pending proposals waiting"
      - name: Container logs
        if: always()
        run: docker logs demo 2>&1 | tail -100
