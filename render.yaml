# Render Blueprint for the public demo: Dashboard -> New -> Blueprint, pick
# this repository, apply. Free plan, one container, no database add-on.
#
# The free plan sleeps after 15 idle minutes and has no persistent disk.
# Both suit the demo: SQLite lives in the container, and every wake-up
# starts from a fresh demo restaurant.

services:
  - type: web
    name: fullhouse-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DEMO_MODE
        value: "true"
      # The assistant answers by rule until a key is added in the Render dashboard (Environment). With LLM_API_KEY
      # set it uses the model below; with ANTHROPIC_API_KEY it uses Claude. Keys are never kept in this file.
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-flash-lite-latest
      - key: DATABASE_URL
        value: sqlite:////tmp/fullhouse.db
