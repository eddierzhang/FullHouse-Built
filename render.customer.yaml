# Render Blueprint for one customer's own FullHouse instance, free:
# Dashboard -> New -> Blueprint, pick this repository, and set Blueprint Path
# to render.customer.yaml. Deploy it once per restaurant, renaming the
# service each time (fullhouse-joes, fullhouse-marias, ...).
#
# Unlike the demo in render.yaml, this one keeps its data and runs the
# agents on a real model, still at no cost:
#   - DATABASE_URL: a free Neon Postgres database, one project per customer
#     (Render's free plan has no persistent disk, so SQLite would be wiped).
#   - LLM_API_KEY, LLM_BASE_URL, LLM_MODEL: any OpenAI-compatible API, e.g.
#     Groq (https://api.groq.com/openai/v1) or Gemini
#     (https://generativelanguage.googleapis.com/v1beta/openai). There is no
#     default model.
# Render asks for these when the Blueprint is applied, and a sync never
# overwrites them. LLM_PROVIDER is not set here either: add LLM_PROVIDER=openai
# under the service's Environment. See DEPLOY.md.

services:
  - type: web
    name: fullhouse-customer
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: DEMO_MODE
        value: "false"
      # The owner's setup fills the restaurant; no sample suppliers or staff.
      - key: SEED_SAMPLE_DATA
        value: "false"
      # The first person to sign up is the owner; everyone else joins with an
      # invite link from Profile -> Team access. "true" would let anyone who
      # finds the site create an account in the restaurant.
      - key: ALLOW_SIGNUP
        value: "false"
      # Encrypts two-step sign-in secrets. Render makes a random one once;
      # never change it, or everyone must set two-step sign-in up again.
      - key: SECRET_KEY
        generateValue: true
      # Error alerts: paste the DSN from a free Sentry project (see DEPLOY.md,
      # "Error alerts"). Left blank, nothing is sent anywhere.
      - key: SENTRY_DSN
        sync: false
      # Who owners and staff contact, shown on the Help page.
      - key: SUPPORT_EMAIL
        sync: false
